version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: taskcanhan_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "taskcanhandb"
      # Do not set MYSQL_USER to 'root' here; root user is configured via MYSQL_ROOT_PASSWORD
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
